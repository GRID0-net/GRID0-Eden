name: Release Linux x86_64

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing Git tag to build and upload to Releases
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    uses: ./.github/workflows/release-build.yml
    with:
      target: linux-x86_64
      tag: ${{ inputs.tag }}
